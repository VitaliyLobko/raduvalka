    try {
      if (localStorage.getItem('radovalka:key') && localStorage.getItem('radovalka:side') === 'vin') {
        document.documentElement.dataset.side = 'vin';
        document.querySelector('meta[name="theme-color"]').content = '#0B384B';
        document.querySelector('link[rel="manifest"]').href = 'manifest-vin.webmanifest';
      }
