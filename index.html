  <title>Радовалка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Його половина — космос одразу, ще до першого кадру (інакше на мить видно її лаванду)
    try {
      if (localStorage.getItem('radovalka:key') && localStorage.getItem('radovalka:side') === 'vin') {
        document.documentElement.dataset.side = 'vin';
        document.querySelector('meta[name="theme-color"]').content = '#0B384B';
        document.querySelector('link[rel="manifest"]').href = 'manifest-vin.webmanifest';
      }
      // Ніч — у нього завжди, у неї — як обрано (за замовчуванням як у телефоні); те саме робить js/theme.js
      var side = document.documentElement.dataset.side, mode = localStorage.getItem('radovalka:theme') || 'auto';
      // Схід і захід сонця над Києвом у хвилинах UTC (NOAA): «По времени» — ніч від заходу до сходу
      var sun = function (d) {
        var g = 2 * Math.PI / 365 * (Math.floor((d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5) - 1), k = Math.PI / 180;
        var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
        var de = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
        var ha = Math.acos(Math.cos(90.833 * k) / (Math.cos(50.45 * k) * Math.cos(de)) - Math.tan(50.45 * k) * Math.tan(de)) / k;
        return [720 - 4 * (30.52 + ha) - eq, 720 - 4 * (30.52 - ha) - eq];
      };
      var now = new Date(), nowMin = now.getUTCHours() * 60 + now.getUTCMinutes(), st = sun(now);
      if (side === 'vin' || mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        || (mode === 'time' && (nowMin < st[0] || nowMin >= st[1]))) {
        document.documentElement.setAttribute('data-dark', '');
        if (side !== 'vin') document.querySelector('meta[name="theme-color"]').content = '#2A1730';
      }
      // Зима її фону: грудень–лютий за Києвом або «Зима» в «Оформлении»
      var season = localStorage.getItem(side === 'vin' ? 'radovalka:season:vin' : 'radovalka:season') || 'auto';
      var md = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Kyiv', month: 'numeric', day: 'numeric' }).formatToParts(new Date());
      var month = 0, day = 0;
      md.forEach(function (p) { if (p.type === 'month') month = Number(p.value); if (p.type === 'day') day = Number(p.value); });
      // У нього взимку сяйво, влітку Чумацький Шлях
      if (season === 'auto' && side === 'vin') season = month === 12 || month <= 2 ? 'aurora' : month >= 6 && month <= 8 ? 'milky' : 'stars';
      if (season === 'auto') season = (month === 12 && day >= 25) || (month === 1 && day <= 14) ? 'newyear' : month === 12 || month <= 2 ? 'winter' : 'spring';
      if (season === 'aurora' || season === 'milky') document.documentElement.classList.add('is-' + season);
      if (season === 'winter' || season === 'newyear') document.documentElement.classList.add('is-winter');
      if (season === 'newyear') document.documentElement.classList.add('is-newyear');
    } catch (e) { /* без сховища — як раніше, тема прийде з сервера */ }
    // Сторож старту: за 12 с застосунок не піднявся (і це не замок чи PIN) — раз стираємо кеш оболонки
    // (у ньому могла лягти суміш версій) і перезавантажуємо, як Ctrl+Shift+R; удруге — напис і кнопка.
    // Тут, а не в модулі: спрацює, навіть якщо модулі не завантажились
    addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        if (!document.body.classList.contains('is-booting') || document.querySelector('.lock-form, .lock-error, .pin-keys')) return;
        var tried = false;
        try { tried = sessionStorage.getItem('radovalka:boot-retry') === '1'; sessionStorage.setItem('radovalka:boot-retry', '1'); } catch (e) { tried = true; }
        if (!tried) {
          try { localStorage.removeItem('radovalka:shell'); } catch (e) { /* нічого */ }
          var again = function () { location.reload(); };
          if (window.caches) caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('shell-radovalka') === 0; }).map(function (k) { return caches.delete(k); })); }).then(again, again); else again();
          return;
        }
        var box = document.createElement('div');
        box.className = 'boot-stuck';
        box.setAttribute('role', 'alert');
        box.innerHTML = '<p>Радовалка не загрузилась</p><button type="button" class="btn btn-primary">Перезагрузить</button>';
        box.querySelector('button').onclick = function () { location.reload(); };
        document.body.append(box);
      }, 12000);
    });
  </script>
